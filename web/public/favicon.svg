<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Light Red Background Gradient (Soft Apple Music / Rose Style) -->
    <linearGradient id="bgLightRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F2" />
      <stop offset="50%" stop-color="#FFE0E4" />
      <stop offset="100%" stop-color="#FFC2CA" />
    </linearGradient>

    <!-- Deep Crimson & Red Gradient for Main Beak Body -->
    <linearGradient id="beakRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA243C" />
      <stop offset="100%" stop-color="#B8001F" />
    </linearGradient>

    <!-- Vibrant Puffin Beak Orange Accent -->
    <linearGradient id="puffinOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#B8001F" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- iOS-Style Squircle Container with Light Red Background -->
  <rect x="32" y="32" width="448" height="448" rx="105" fill="url(#bgLightRed)" />

  <!-- Subtle Inner Border for High-Resolution Polish -->
  <rect x="32" y="32" width="448" height="448" rx="105" fill="none" stroke="#FFA3B1" stroke-width="3" opacity="0.7" />

  <!-- Main Musical Beak Icon Group -->
  <g filter="url(#softShadow)" transform="translate(20, 10)">

    <!-- Outer Beak Arc / Soundwave Shell -->
    <path d="M 160,130 C 270,110 360,180 370,290 C 370,300 360,310 350,305 C 290,285 220,280 160,300 Z" fill="url(#puffinOrange)" />

    <!-- Main Puffin Beak Body (Eighth-Note Hybrid) -->
    <path d="M 150,140 C 250,130 330,190 340,280 C 280,260 210,260 150,280 Z" fill="url(#beakRed)" />

    <!-- Puffin Beak Stripe Accent (Light Cream / White for Contrast) -->
    <path d="M 285,178 C 265,215 250,250 240,268" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.95" />

    <path d="M 315,200 C 298,230 285,255 278,272" fill="none" stroke="#FFD166" stroke-width="10" stroke-linecap="round" opacity="0.9" />

    <!-- Integrated Note Head & Stem Base -->
    <path d="M 150,140 L 150,310 C 140,300 120,295 100,305 C 70,320 60,350 78,375 C 96,400 135,405 165,390 C 190,375 195,350 190,325 L 190,200 L 330,170 L 330,140 Z" fill="#1C1B1F" />

    <!-- White Inner Glow / Reflection on Note Head -->
    <ellipse cx="115" cy="355" rx="16" ry="10" transform="rotate(-25 115 355)" fill="#FFFFFF" opacity="0.35" />
  </g>
</svg>
